name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Ensure main.py exists
        run: |
          if [ ! -f "main.py" ]; then
            if [ -f "mobile_app.py" ]; then
              cp mobile_app.py main.py
            elif [ -f "app.py" ]; then
              cp app.py main.py
            fi
          fi

      - name: Build Android APK (Auto-Accept Prompts)
        run: |
          yes | flet build apk --project="OfflineMusic" --no-android-splash -v

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMusic-APK
          path: build/apk/*.apk
          if-no-files-found: error
